<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klasický editor roláží</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans flex flex-col items-center justify-center min-h-screen py-8">

    <script data-goatcounter="https://vlccek.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

    <div class="container mx-auto p-8 bg-white rounded-lg shadow-xl max-w-5xl">
        <header class="flex justify-between items-center mb-6 pb-4 border-b">
            <h1 class="text-3xl font-bold text-gray-800">Klasický editor</h1>
            <a href="advanced.html" class="text-indigo-600 hover:text-indigo-800 font-medium transition-colors duration-300">Přejít na pokročilý editor &rarr;</a>
        </header>
        

        <div id="editor-classic">
             <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                <div>
                    <label for="image-upload-1" class="block text-lg font-medium text-gray-700 mb-2">Obrázek 1 (Normální)</label>
                    <input type="file" id="image-upload-1" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                </div>
                <div>
                    <label for="image-upload-2" class="block text-lg font-medium text-gray-700 mb-2">Obrázek 2 (Přeházený)</label>
                    <input type="file" id="image-upload-2" accept="image/*" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
                </div>
            </div>
        </div>

        <div id="common-controls">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-6 px-4 border-t pt-6 mt-6">
                <div>
                    <label for="strips-slider" class="block text-lg font-medium text-gray-700">Počet proužků</label>
                    <input type="range" id="strips-slider" min="2" max="200" value="20" step="2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mt-2">
                    <div class="text-center text-sm text-gray-600 mt-1"><span id="strips-value" class="font-bold">20</span></div>
                </div>
                <div>
                    <label for="width-pattern" class="block text-lg font-medium text-gray-700">Rozložení</label>
                    <select id="width-pattern" class="mt-2 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="uniform">Rovnoměrné</option>
                        <option value="center-in">Širší uprostřed</option>
                        <option value="center-out">Užší uprostřed</option>
                    </select>
                </div>
                <div>
                    <label for="orientation" class="block text-lg font-medium text-gray-700">Směr</label>
                    <select id="orientation" class="mt-2 block w-full py-2 px-3 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="vertical">Svisle</option>
                        <option value="horizontal">Vodorovně</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-center mb-6">
                <button id="export-btn" class="bg-emerald-500 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-lg text-lg shadow-md hover:shadow-lg transition-shadow duration-300 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    Stáhnout roláž (JPG)
                </button>
            </div>

            <div>
                <h2 class="text-2xl font-semibold text-center mb-4">Výsledek</h2>
                <div class="w-full bg-gray-200 rounded-lg shadow-inner p-2">
                    <canvas id="canvas" class="w-full rounded-md"></canvas>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>Autor: <span class="font-medium">Jakub Vlk</span> | 
           Zdrojový kód: <a href="https://github.com/vlccek/rolaz" target="_blank" class="text-indigo-500 hover:text-indigo-700 underline">github.com/vlccek/rolaz</a>
        </p>
        <p class="mt-1 text-xs opacity-75">🔒 Veškeré zpracování probíhá lokálně ve vašem prohlížeči, žádné obrázky nejsou nikam posílány.</p>
    </footer>

    <script src="simple.js"></script>
</body>
</html>
